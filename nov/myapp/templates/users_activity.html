{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="card">
        <h1>Активность пользователей за текущий месяц</h1>
        <ul>
            {% for user_data in users_data %}
            <li>{{ user_data.user.username }} - Activities: {{ user_data.total_hours }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock content %}
