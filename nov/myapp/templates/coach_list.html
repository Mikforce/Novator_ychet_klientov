{% extends 'base.html' %}

{% block content %}

<div class="container">
    <div class="card">

        <h1>Список учителей</h1>
        <ul>
          {% for coach in coaches %}
            <li>{{ coach.id }} -{{ coach.full_name }} - {{ coach.phone_number }}</li>
          {% empty %}
            <li>No coaches yet.</li>
          {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
