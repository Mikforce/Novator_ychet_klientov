{% extends 'base.html' %}

{% block content %}
  <h2>Lessons</h2>
  <table>
    <tr>
      <th>Name</th>
      <th>Salary per Hour</th>
    </tr>
    {% for lesson in lessons %}
      <tr>
        <td>{{ lesson.name }}</td>
        <td>{{ lesson.salary_per_hour }}</td>
      </tr>
    {% empty %}
      <tr>
        <td>No lessons found.</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
