{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">


<head>
    <title>Edit Coach</title>
</head>
<body>
    <h1>Edit Coach</h1>
    <form method="post">
        {% csrf_token %}
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" value="{{ coach.full_name }}"><br><br>

        <label for="phone_number">Phone Number:</label>
        <input type="text" id="phone_number" name="phone_number" value="{{ coach.phone_number }}"><br><br>

        <label for="percent">Percentage:</label>
        <input type="text" id="percent" name="percent" value="{{ coach.percent }}"><br><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>


    </div>
</div>
{% endblock %}
