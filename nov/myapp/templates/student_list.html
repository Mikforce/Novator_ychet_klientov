{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <h1>Student List</h1>
        <table>
            <thead>

            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.author }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.pass_type }}</td>
                    <td>{{ student.start_time }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Student</button>
        </form>
    </div>
</div>
{% endblock %}
