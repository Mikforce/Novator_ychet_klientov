{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 class="card-title">Редактировать абонемент</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group d-flex align-items-center mb-3">
                <label for="group" class="me-3">Группа:</label>
                <select id="group" name="group" class="form-control flex-grow-1">
                    {% for group in groups %}
                        <option value="{{ group.id }}" {% if group.id == subscription.group.id %} selected {% endif %}>{{ group.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group d-flex align-items-center mb-3">
                <label for="client" class="me-3">Ученик:</label>
                <select id="client" name="client" class="form-control flex-grow-1">
                    {% for client in clients %}
                        <option value="{{ client.id }}" {% if client.id == subscription.client.id %} selected {% endif %}>{{ client.full_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group d-flex align-items-center mb-3">
                <label for="coach" class="me-3">Учитель:</label>
                <select id="coach" name="coach" class="form-control flex-grow-1">
                    {% for coach in coaches %}
                        <option value="{{ coach.id }}" {% if coach.id == subscription.coach.id %} selected {% endif %}>{{ coach.full_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group d-flex align-items-center mb-3">
                <label for="lessons_count" class="me-3">Количество занятий:</label>
                <input type="text" id="lessons_count" name="lessons_count" class="form-control flex-grow-1" value="{{ subscription.lessons_count }}">
            </div>

            <div class="form-check d-flex align-items-center mb-3">
                <input type="checkbox" id="attendance" name="attendance" class="form-check-input me-3" {% if subscription.attendance %} checked {% endif %}>
                <label for="attendance">Оплата</label>
            </div>

               <div class="form-group d-flex align-items-center mb-3">
        <label for="price" class="me-3">Стоимость абонемента:</label>
        <input type="number" id="price" name="price" class="form-control flex-grow-1" value="{{ price }}" required>
    </div>

            <div class="form-group">
                <label for="comment">Комментарии:</label>
                <textarea id="comment" name="comment" class="form-control">{{ subscription.comment }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>

        </form>
    </div>
</div>

{% endblock %}
