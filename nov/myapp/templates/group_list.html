{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">

  <h1>Список групп</h1>
    <table>
        <tr>
            <th>Название</th>
            <th>Тренер</th>
            <th>Описание</th>
        </tr>
        {% for group in groups %}
        <tr>
            <td>{{ group.name }}</td>
            <td>{{ group.coach.full_name }}</td>
            <td>{{ group.description }}</td>
            <td><a class="btn btn-default" href="{% url 'update_group' group.pk %}">Редактировать</a></td>
            <td><a class="btn btn-default" href="{% url 'delete_group' group.pk %}">Удалить</a></td>

        </tr>
        {% endfor %}
    </table>


    </div>
</div>


{% endblock %}
