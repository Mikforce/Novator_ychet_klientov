{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">

            <h1>Изменения группы</h1>
                  <form method="post">
                    {% csrf_token %}
                    <label for="id_name">Name:</label>
                    <input type="text" name="name" id="id_name" value="{{ group.name }}">
                    <br><br>
                    <label for="id_coach">Coach:</label>
                    <select name="coach" id="id_coach">
                      {% for coach in coaches %}
                        {% if coach.id == group.coach_id %}
                          <option value="{{ coach.id }}" selected>{{ coach.full_name }}</option>
                        {% else %}
                          <option value="{{ coach.id }}">{{ coach.full_name }}</option>
                        {% endif %}
                      {% endfor %}
                    </select>
                    <br><br>
                    <label for="id_description">Description:</label>
                    <textarea name="description" id="id_description">{{ group.description }}</textarea>
                    <br><br>
                    <button type="submit">Save Changes</button>
                  </form>


    </div>
</div>
{% endblock %}
