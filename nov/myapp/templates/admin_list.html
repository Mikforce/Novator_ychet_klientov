{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
      <h1>Администратор</h1>
      <ul>
        {% for admin in admins %}
          <li>{{ admin }} - {{ admin.get_time_spent_this_month }}</li>
        {% empty %}
          <li>No admins yet.</li>
        {% endfor %}
      </ul>

    </div>
</div>

{% endblock %}
