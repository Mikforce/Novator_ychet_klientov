{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
         <h1>Добавление группы</h1>
              <form method="post">
                {% csrf_token %}
                <label for="id_name">Name:</label>
                <input type="text" name="name" id="id_name">
                <br><br>
                <label for="id_coach">Coach:</label>
                <select name="coach" id="id_coach">
                  {% for coach in coaches %}
                    <option value="{{ coach.id }}">{{ coach.full_name }}</option>
                  {% endfor %}
                </select>
                <br><br>
                <label for="id_description">Description:</label>
                <textarea name="description" id="id_description"></textarea>
                <br><br>
                <button type="submit">Add Group</button>
              </form>

    </div>
</div>

{% endblock %}
